name: ci

on:
  push:
    branches: [main]
  pull_request:

# 顶层只读：job 需要写权限时再单独提权（默认权限可能是 write，这是最常见的过度授权）
permissions:
  contents: read
  # 贡献归属门禁只读 PR / commits / issue 评论，不写 PR、标签或仓库内容。
  pull-requests: read

# 同一分支的旧运行直接取消：省 runner，也避免"旧结果盖新结果"
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # preflight 的贡献归属门禁通过 gh api 只读查询；local / main push 为 SKIP。
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        node: [22, 24]
    steps:
      # fetch-depth: 0 —— check-maintenance 要读 tag，浅克隆会看不到
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # engines 回归使用官方 node-semver；CI 不能假设仓库自带 node_modules。
      - name: 安装测试依赖
        run: npm ci --ignore-scripts --no-audit --no-fund

      # PR 分支跳过「维护一致性」：版本号已 bump，但 tag 要合并后才打，这条必然红。
      # 它改由下面那步只在 push 到 main 时跑。
      - name: 门禁（单测 / 语法 / 路由 / 打包内容 / 文案 / 术语 / UI）
        run: node scripts/preflight.mjs --fast ${{ github.event_name == 'pull_request' && '--no-maintenance' || '' }}

      - name: UI 体检（写死颜色 / 可访问性 / 官方结构）
        run: node scripts/ui-audit.mjs

      - name: 文档契约（链接 / 索引总数 / 阅读路径）
        run: node scripts/check-docs.mjs

      # 只在 main 上查：PR 分支的版本号还没打 tag，这条必然红
      - name: 维护一致性（版本 / tag / CHANGELOG / 徽章）
        if: github.event_name == 'push'
        run: node scripts/check-maintenance.mjs
